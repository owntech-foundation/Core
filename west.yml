# This west manifest replace default west manifest located in
# .platformio/packages/framework-zephyr/west.yml. Genuine
# default version is backup as west.yml.bak in the same folder
#
# This file defines the module dependencies of Zephyr RTOS.
# A script located in owntech/scripts/pre_west.py makes sure
# the local (project based) west.yml file supplant the default
# one.
#
# A power user can change dependencies version or add new ones
# at his will using the manifest below.

manifest:
  defaults:
    remote: upstream

  remotes:
    - name: upstream
      url-base: https://github.com/zephyrproject-rtos
    - name: owntech
      url-base: https://github.com/owntech-foundation
    - name: thingset
      url-base: https://github.com/thingset

  group-filter: [-optional]

  #
  # Please add items below based on alphabetical order
  projects:
    - name: cmsis_6
      repo-path: CMSIS_6
      revision: 06d952b6713a2ca41c9224a62075e4059402a151
      path: modules/hal/cmsis_6
      groups:
        - hal
    - name: cmsis-dsp
      revision: 97512610ec92058f0119450b9e743eeb7e95b5c8
      path: modules/lib/cmsis-dsp
    - name: fatfs
      revision: f4ead3bf4a6dab3a07d7b5f5315795c073db568d
      path: modules/fs/fatfs
      groups:
        - fs
    # Use owntech fork of hal_stm32 that only ships STM32G4XX files
    # to reduce install size and time.
    - name: hal_stm32
      remote: owntech
      revision: ff0e1eef21c69707c152f2900458c9160fdf9116
      path: modules/hal/stm32
      groups:
        - hal
    - name: littlefs
      path: modules/fs/littlefs
      groups:
        - fs
      revision: 8f5ca347843363882619d8f96c00d8dbd88a8e79
    - name: mcuboot
      revision: 6d3b3d2c38ab20c242e5b9abb04d050086383eb2
      path: bootloader/mcuboot
      groups:
        - bootloader
    - name: segger
      revision: 50892fdbcf2f570e67baa72b8894a66b16946f72
      path: modules/debug/segger
      groups:
        - debug
    - name: zcbor
      revision: 9164bd18dcd88ff9d9ef98279501fc1093571017
      path: modules/lib/zcbor
    - name: thingset-zephyr-sdk
      remote: thingset
      revision: e57447bbeb7c165e14a273242e8495343c1c6f54
      path: thingset-zephyr-sdk
      import:
        name-allowlist:
          - thingset-node-c
          - zcbor
    - name: thingset-node-c
      remote: thingset
      revision: 68c7544830df2ba23f67e31bad91e124377827a3
      path: modules/thingset-node-c
      import: true

  self:
    path: zephyr
    west-commands: scripts/west-commands.yml
    import: submanifests
