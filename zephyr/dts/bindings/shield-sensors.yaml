description: List of a shield sensors that can be acquired by Spin ADCs

compatible: "shield-sensors"

properties:
  sensor-name:
    type: string
    required: true
    description: Name under which the sensor will be referred to in user code.

  default-gain:
    type: int
    required: false
    description: Value of the gain (multiplication to be applied on the raw measured value).
                 The value represents a float32_t, thus is stored in IEEE754 format.

  default-offset:
    type: int
    required: false
    description: Value of the offset (to be added after the raw value has been multiplied by the gain).
                 The value represents a float32_t, thus is stored in IEEE754 format.

  default-r0:
    type: int
    required: false
    description: Value of the resistance of the thermistor at a reference temperature.

  default-b:
    type: int
    required: false
    description: Value of the coefficient of resistance change with temperature of the thermistor
                 material.

  default-rdiv:
    type: int
    required: false
    description: Value of the resistance used in the bridge to condition the temperature measurement.

  default-t0:
    type: int
    required: false
    description: Value of the offset (to be added after the raw value has been multiplied by the gain).
                 The value represents a float32_t, thus is stored in IEEE754 format.


  mux-spin-pin-1:
    type: int
    required: false
    description: PIN IN 1 used in the mux for temperature sensor on the Ownverter. 

  mux-spin-pin-2:
    type: int
    required: false
    description: PIN IN 1 used in the mux for temperature sensor on the Ownverter. 


  default-adc:
    type: string
    required: false
    default: "UNKNOWN_ADC"
    enum:
      - "UNKNOWN_ADC"
      - "ADC_1"
      - "ADC_2"
      - "ADC_3"
      - "ADC_4"
      - "ADC_5"
    description: Default ADC used for acquisition by enableDefaultSensors().
                 UNKNOWN_ADC means the sensor is not enabled by default.

  default-order:
    type: int
    required: false
    default: 255
    description: Position in the enableDefaultSensors() acquisition sequence.
                 Lower values are enabled first, determining the per-ADC channel
                 order. Only meaningful when default-adc is not UNKNOWN_ADC.
                 Sensors without this property (default 255) are not ordered.

  sensor-conv-type:
    type: string
    required: false
    description: Type of conversion performed by the sensor. Typically LINEAR or LOG.


child-binding:

  description: Sensor node ADC info

  properties:

    io-channels:
      type: phandle-array
      required: true
      description: ADC number and channel description.

    spin-pin:
      type: int
      required: true

    differential:
      type: boolean
      required: false
      description: Set the channel to differential mode. Default is Single Ended.
